# Dijalankan di VPS dari /opt/wa-automation (lihat deploy/deploy.sh). Rahasia ada di .env di folder itu.
#
# Satu container saja. WhatsApp (Baileys) berjalan di dalam proses app: tiap nomor = satu koneksi
# WebSocket keluar ke server WhatsApp, jadi tidak ada port tambahan yang perlu dibuka atau dijaga.
# Jaringan host dipakai supaya app menjangkau Hermes dan PostgreSQL di loopback tanpa mengubah firewall:
#   app         127.0.0.1:$APP_PORT (bawaan 3200) <- Caddy (chatgercep.com)
#   PostgreSQL  127.0.0.1:5433  (proyek compose terpisah: /opt/wa-postgres, lihat deploy/postgres/)
#   Hermes      127.0.0.1:8644  (user suka-automation)
# DATABASE_URL ada di .env (= WA_DATABASE_URL di /opt/wa-postgres/.env).
name: wa-automation

services:
  app:
    build: .
    image: wa-automation-app:local
    restart: unless-stopped
    # Waktu untuk mati dengan rapi: menutup koneksi WhatsApp + menuntaskan tulisan kunci (biasanya
    # < 1 dtk; paling lama ±22 dtk bila database sedang tersendat dan tulisan dicoba ulang).
    stop_grace_period: 30s
    network_mode: host
    env_file: .env
    environment:
      HOSTNAME: 127.0.0.1
      # Port bisa diatur lewat APP_PORT di .env (VPS 31.97.67.66: 3230, karena 3200 dipakai app lain).
      PORT: "${APP_PORT:-3200}"
      DATA_DIR: /data
      HERMES_API_URL: http://127.0.0.1:8644
      HERMES_PROFILE: cs
      MAKS_NOMOR: "${MAKS_NOMOR:-250}"
      # Heap V8 dibatasi di bawah mem_limit supaya GC bekerja sebelum container dibunuh kernel.
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      # Semua data kini di PostgreSQL. Volume ini hanya memuat wa.db lama (SQLite): isinya
      # diimpor otomatis sekali saat pertama kali menyambung ke PostgreSQL yang masih kosong,
      # lalu dibiarkan sebagai cadangan.
      - wa_data:/data
    # Terukur: app ±72 MB + pustaka Baileys ±40 MB, lalu ±2,5–3,5 MB per nomor terhubung (cukup untuk 250+ nomor).
    mem_limit: 2048m
    # journald: log tetap ada setelah container dibuat ulang saat deploy (json-file ikut terhapus),
    # supaya penyebab nomor terputus selalu bisa dilacak: journalctl -t wa-automation --since "1 hour ago"
    logging:
      driver: journald
      options: { tag: wa-automation }

volumes:
  wa_data:
