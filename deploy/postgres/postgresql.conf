# PostgreSQL 15 untuk database kecil di VPS yang memorinya ketat (2 vCPU, RAM bersama banyak layanan).
# Prinsip: memori tetap sekecil mungkin, tidak ada proses latar yang tidak dipakai, daya tahan data
# (fsync, checksum, full_page_writes) TIDAK dikorbankan.

# --- Koneksi: hanya dari server ini sendiri ---
listen_addresses = '127.0.0.1'
port = 5433
max_connections = 20                    # tiap koneksi = satu proses; app cukup memakai pool kecil (<= 10)
superuser_reserved_connections = 2
password_encryption = scram-sha-256

# --- Memori ---
shared_buffers = 32MB                   # bawaan 128MB; sisanya biarkan di cache berkas OS yang dipakai bersama
work_mem = 2MB                          # per operasi sort/hash, per koneksi
maintenance_work_mem = 16MB
autovacuum_work_mem = 8MB
temp_buffers = 4MB
effective_cache_size = 256MB            # hanya petunjuk bagi perencana query, bukan alokasi
huge_pages = off
jit = off                               # kompilasi JIT hanya menguntungkan query analitik besar

# --- Tanpa replikasi dan tanpa query paralel: lebih sedikit proses dan WAL ---
wal_level = minimal
max_wal_senders = 0
max_replication_slots = 0
max_logical_replication_workers = 0     # proses "logical replication launcher" tidak dijalankan
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# --- WAL & checkpoint: tulis ke disk jarang dan merata ---
wal_compression = lz4
min_wal_size = 32MB
max_wal_size = 128MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Disk SSD ---
random_page_cost = 1.1
effective_io_concurrency = 100

# --- Autovacuum: tetap hidup, satu pekerja saja ---
autovacuum_max_workers = 1
autovacuum_naptime = 2min

# --- Pengaman ---
idle_in_transaction_session_timeout = 60s   # transaksi yang ditinggal terbuka menahan kunci dan vacuum
# Batas waktu query dipasang pada role aplikasi (init/10-wa.sh), bukan di sini, supaya pekerjaan
# pemeliharaan oleh superuser tidak ikut terpotong.

# --- Log: hanya yang perlu ditindaklanjuti ---
log_min_duration_statement = 500ms
log_checkpoints = off
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'Asia/Jakarta'
timezone = 'Asia/Jakarta'
