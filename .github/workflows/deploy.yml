# Push ke main -> lint, build, seluruh uji -> deploy ke VPS.
# Deploy hanya terjadi bila semua langkah sebelumnya lolos. Di VPS, paketnya diterima oleh
# deploy/terima-deploy.sh, yang mengembalikan versi sebelumnya bila versi baru tidak sehat.
#
# Secrets repo yang dipakai: VPS_HOST, VPS_SSH_KEY (kunci khusus deploy), VPS_KNOWN_HOSTS.
name: Uji & deploy

on:
  push:
    branches: [main]
    # Perubahan dokumen/knowledge saja tidak perlu membangun ulang dan me-restart app.
    paths-ignore:
      - "**.md"
      - "knowledge-cs/**"
      - "hermes/**"
      - "video/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji-dan-bangun:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Push baru saat masih tahap uji/build langsung membatalkan proses uji commit lama yang usang.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # onnxruntime-node (ML penyaring prospek): jangan unduh biner CUDA (ratusan MB) saat npm ci; cukup CPU.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Pasang dependensi (hanya bila package-lock berubah)
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Lint & Build
        run: |
          npx eslint
          npm run build

      - name: Uji (2 jalur tanpa perebutan CPU untuk tolok ukur DB)
        run: npm run uji

      - name: Uji server hasil build
        run: node --no-warnings --import ./uji/loader.mjs uji/uji-next.mjs
        env:
          TANPA_WHATSAPP: "1" # runner tidak perlu membuka koneksi ke WhatsApp

      - name: Susun paket
        run: |
          mkdir -p paket/standalone/.next
          cp -r .next/standalone/. paket/standalone/
          cp -r .next/static paket/standalone/.next/static
          if [ -d public ]; then cp -r public paket/standalone/public; fi
          rm -rf paket/standalone/data paket/standalone/.env* paket/standalone/node_modules/@img
          # onnxruntime-node membawa biner semua platform (±290 MB); server hanya butuh Linux.
          for d in paket/standalone/node_modules/onnxruntime-node/bin/napi-v*; do [ -d "$d" ] && find "$d" -mindepth 1 -maxdepth 1 ! -name linux -exec rm -rf {} +; done
          echo "$GITHUB_SHA" > paket/standalone/VERSI
          cp deploy/Dockerfile deploy/docker-compose.yml paket/
          GZIP=-1 tar czf paket.tgz -C paket .
          ls -lh paket.tgz

      - name: Simpan paket deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: paket-deploy
          path: paket.tgz
          compression-level: 0
          retention-days: 1

  deploy:
    needs: uji-dan-bangun
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Satu deploy ke VPS pada satu waktu; tidak pernah memutus pengiriman yang sedang berjalan.
    concurrency:
      group: deploy-produksi
      cancel-in-progress: false
    steps:
      - name: Unduh paket deploy
        uses: actions/download-artifact@v4
        with:
          name: paket-deploy

      - name: Deploy ke VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Kunci ini hanya bisa menjalankan penerima deploy di server; paket dikirim lewat stdin.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "root@$VPS_HOST" < paket.tgz
          rm -f ~/.ssh/deploy
