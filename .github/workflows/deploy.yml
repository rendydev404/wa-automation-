# Push ke main -> bersamaan: (build + uji server hasil build), (lint + cek tipe), dan seluruh uji yang dibagi
# 3 jalur di mesin masing-masing (uji/jalankan-semua.mjs) -> deploy ke VPS. Deploy hanya terjadi bila semua lolos. Di VPS, paketnya diterima oleh deploy/terima-deploy.sh, yang
# mengembalikan versi sebelumnya bila versi baru tidak sehat.
#
# Secrets repo yang dipakai: VPS_HOST, VPS_SSH_KEY (kunci khusus deploy), VPS_KNOWN_HOSTS.
name: Uji & deploy

on:
  push:
    branches: [main]
    # Perubahan dokumen/knowledge saja tidak perlu membangun ulang dan me-restart app.
    paths-ignore:
      - "**.md"
      - "knowledge-cs/**"
      - "hermes/**"
      - "video/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # onnxruntime-node (ML penyaring prospek): jangan unduh biner CUDA (ratusan MB) saat npm ci; cukup CPU.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  bangun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Push baru saat masih tahap ini langsung membatalkan proses commit lama yang usang (job deploy tidak).
    concurrency:
      group: ci-bangun-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Pasang dependensi (hanya bila package-lock berubah)
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          # Cek tipe dikerjakan job `periksa` secara paralel (tsc), jadi tidak diulang di jalur kritis build.
          LEWATI_CEK_TIPE: "1"

      - name: Uji server hasil build
        run: node --no-warnings --import ./uji/loader.mjs uji/uji-next.mjs
        env:
          TANPA_WHATSAPP: "1" # runner tidak perlu membuka koneksi ke WhatsApp

      - name: Susun paket
        run: bash deploy/susun-paket.sh "$GITHUB_SHA"

      - name: Simpan paket deploy
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: paket-deploy
          path: paket/
          compression-level: 0
          retention-days: 1

  periksa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ci-periksa-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Pasang dependensi (hanya bila package-lock berubah)
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      # Hasil lint & cek tipe per berkas disimpan: commit berikutnya hanya memeriksa ulang berkas yang berubah.
      - name: Cache lint & cek tipe
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: periksa-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            periksa-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npx eslint --cache --cache-location .eslintcache

      - name: Cek tipe
        run: npx next typegen && npx tsc --noEmit -p .

  uji:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        jalur: [alur, tolok, fitur]
    # Push baru saat masih tahap ini langsung membatalkan proses commit lama yang usang (job deploy tidak).
    concurrency:
      group: ci-uji-${{ matrix.jalur }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Pasang dependensi (hanya bila package-lock berubah)
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Uji jalur ${{ matrix.jalur }}
        run: npm run uji -- --jalur=${{ matrix.jalur }}

  deploy:
    needs: [bangun, periksa, uji]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Satu deploy ke VPS pada satu waktu; tidak pernah memutus pengiriman yang sedang berjalan.
    concurrency:
      group: deploy-produksi
      cancel-in-progress: false
    steps:
      - name: Unduh paket deploy
        uses: actions/download-artifact@v4
        with:
          name: paket-deploy
          path: paket

      - name: Deploy ke VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Kunci ini hanya bisa menjalankan penerima deploy di server (perintahnya diperiksa di sana).
          # Satu koneksi dipakai bersama oleh semua perintah (ControlMaster): jabat tangan SSH cukup sekali.
          SSH=(ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
               -o ConnectTimeout=20 -o ControlMaster=auto -o ControlPath=~/.ssh/cm-%C -o ControlPersist=120 "root@$VPS_HOST")
          SPEK=$(tr '\n' ' ' < paket/spek)
          # Lapisan besar (node_modules, ml) hanya dikirim bila server belum punya isi yang sama.
          for nama in $("${SSH[@]}" "lapisan $SPEK" | sed -n 's/^perlu //p'); do
            echo "Mengirim lapisan $nama ($(du -h "paket/$nama.tar.zst" | cut -f1))"
            "${SSH[@]}" "kirim-lapisan $(grep "^$nama:" paket/spek)" < "paket/$nama.tar.zst"
          done
          echo "Mengirim app ($(du -h paket/app.tar.zst | cut -f1))"
          "${SSH[@]}" "pasang $(cat paket/versi) $SPEK" < paket/app.tar.zst
          "${SSH[@]}" -O exit 2>/dev/null || true
          rm -f ~/.ssh/deploy
